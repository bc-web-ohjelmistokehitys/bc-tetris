<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tetris (BC-teema)</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="game-container">
    <div class="game-header">
      <h1>TETRIS</h1>

      <div class="score-board">
        <div class="score-item">
          <span class="label">Pisteet</span>
          <span id="score">0</span>
        </div>
        <div class="score-item">
          <span class="label">Rivit</span>
          <span id="lines">0</span>
        </div>
        <div class="score-item">
          <span class="label">Taso</span>
          <span id="level">1</span>
        </div>
        <div class="score-item">
          <span class="label">Ennätys</span>
          <span id="highScore">0</span>
        </div>
      </div>
    </div>

    <div class="game-main">
      <div class="game-area">
        <!-- width/height are set in JS from BOARD_* and BLOCK_SIZE -->
        <canvas id="gameCanvas"></canvas>

        <div class="game-overlay" id="gameOverlay">
          <div class="overlay-content">
            <h2 id="overlayTitle">Game Over!</h2>
            <p id="overlayMessage">Final Score: 0<br/>Paina Start tai P jatkaaksesi</p>
          </div>
        </div>
      </div>

      <div class="game-sidebar">
        <div class="next-piece">
          <h3>Seuraava</h3>
          <canvas id="nextCanvas" width="140" height="140"></canvas>
        </div>

        <div class="controls">
          <h3>Ohjaimet</h3>
          <div class="control-item"><span class="key">← →</span><span class="action">Siirrä</span></div>
          <div class="control-item"><span class="key">↓</span><span class="action">Pudota</span></div>
          <div class="control-item"><span class="key">↑</span><span class="action">Käännä</span></div>
          <div class="control-item"><span class="key">SPACE</span><span class="action">Hard Drop</span></div>
          <div class="control-item"><span class="key">P</span><span class="action">Tauko / Jatka</span></div>
        </div>
      </div>
    </div>

    <div class="game-footer">
      <button id="startBtn" class="game-btn">Start</button>
      <button id="pauseBtn" class="game-btn" disabled>Pausoi</button>
    </div>
  </div>

  <script src="tetris.js"></script>
</body>
</html>
